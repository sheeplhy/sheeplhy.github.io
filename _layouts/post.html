---
layout: default
---
<article class="post shell">
  <header class="post-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← 返回文章</a>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y年%m月%d日' }}</time>
      {% if page.categories.size > 0 %}<span>{{ page.categories | join: ' / ' }}</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose post-content">{{ content }}</div>
</article>
