<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">我使用的单变量调试闭环</title>
  <desc id="desc">从确认输入和触发条件开始，建立基线，只改变一个变量，对比区域与伪影，记录结论并回退复验。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081526"/><stop offset="1" stop-color="#102d37"/></linearGradient><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#6fdcc5"/></marker></defs>
  <rect width="1200" height="500" rx="34" fill="url(#bg2)"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6fdcc5" letter-spacing="3">MY DEBUG LOOP · 原创示意</text>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">把“感觉画面变了”变成可以复验的结论</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 205)"><rect width="190" height="120" rx="22" fill="#142d43" stroke="#315477"/><text x="95" y="50" font-size="18" font-weight="700" fill="#fff">确认输入</text><text x="95" y="81" font-size="14" fill="#9fb6cd">格式 · Metadata · Trigger</text></g>
    <g transform="translate(280 205)"><rect width="190" height="120" rx="22" fill="#142d43" stroke="#315477"/><text x="95" y="50" font-size="18" font-weight="700" fill="#fff">保存基线</text><text x="95" y="81" font-size="14" fill="#9fb6cd">先看默认与旁路状态</text></g>
    <g transform="translate(505 205)"><rect width="190" height="120" rx="22" fill="#173a3a" stroke="#2e766a"/><text x="95" y="50" font-size="18" font-weight="700" fill="#fff">只改一个变量</text><text x="95" y="81" font-size="14" fill="#9fd8cd">小步调整 · 保持可回退</text></g>
    <g transform="translate(730 205)"><rect width="190" height="120" rx="22" fill="#142d43" stroke="#315477"/><text x="95" y="50" font-size="18" font-weight="700" fill="#fff">观察 ROI</text><text x="95" y="81" font-size="14" fill="#9fb6cd">纹理 · 噪声 · 伪影 · 运动</text></g>
    <g transform="translate(955 205)"><rect width="190" height="120" rx="22" fill="#142d43" stroke="#315477"/><text x="95" y="50" font-size="18" font-weight="700" fill="#fff">记录与复验</text><text x="95" y="81" font-size="14" fill="#9fb6cd">回退 · 对照 · 换场景</text></g>
  </g>
  <g stroke="#6fdcc5" stroke-width="3" fill="none" marker-end="url(#a2)"><path d="M245 265H268"/><path d="M470 265H493"/><path d="M695 265H718"/><path d="M920 265H943"/><path d="M1050 337C1050 420 155 420 155 337"/></g>
  <text x="600" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9fb6cd">如果触发没有命中、输入无效或模块未启用，后面的参数讨论都没有意义。</text>
</svg>
